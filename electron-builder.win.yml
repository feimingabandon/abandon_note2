extends: 'file:./electron-builder.base.yml'
win:
  executableName: AbandonNote
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: native_blur/build/bin/
      to: native_blur/
      filter:
        - '*.dll'
nsis:
  # 沿用 0.9.x 安装器身份；appId 规范化后仍可覆盖升级并保持单一卸载项。
  guid: 41249b74-bbe0-5d8d-8a9d-7f1bd6f04a19
  artifactName: Abandon-Note-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  installerLanguages:
    - zh_CN
    - en_US
