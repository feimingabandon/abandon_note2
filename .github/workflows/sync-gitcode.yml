name: Sync Release to GitCode

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已公开的 GitHub Release 标签；留空时仅验证 GitCode API 访问'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitcode-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  GITCODE_API_BASE: https://api.gitcode.com/api/v5
  GITCODE_OWNER: zou-feiming
  GITCODE_REPO: abandon_note2

jobs:
  verify-access:
    name: Verify GitCode access
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify repository API access
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: bash .github/scripts/verify-gitcode-access.sh

  sync-release:
    name: Sync published Release to GitCode
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      TARGET_COMMITISH: main
      RELEASE_ASSET_DIR: release-assets
      RELEASE_BODY_FILE: release-body.md
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify repository API access
        run: bash .github/scripts/verify-gitcode-access.sh

      - name: Download GitHub Release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_ASSET_DIR"

      - name: Prepare release metadata
        env:
          MANUAL_RELEASE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$MANUAL_RELEASE_SYNC" == "true" ]]; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,name,body,tagName)"
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "false" ]]; then
              echo "Manual GitCode synchronization requires a published GitHub Release: ${RELEASE_TAG}." >&2
              exit 1
            fi
            jq -r '.body // ""' <<< "$release_json" > "$RELEASE_BODY_FILE"
            release_name="$(jq -r '.name // .tagName' <<< "$release_json")"
            prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
          else
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > "$RELEASE_BODY_FILE"
            release_name="$(jq -r '.release.name // .release.tag_name' "$GITHUB_EVENT_PATH")"
            prerelease="$(jq -r '.release.prerelease // false' "$GITHUB_EVENT_PATH")"
          fi
          {
            echo "RELEASE_NAME<<__RELEASE_NAME__"
            echo "$release_name"
            echo "__RELEASE_NAME__"
            echo "PRERELEASE=${prerelease}"
          } >> "$GITHUB_ENV"

      - name: Synchronize GitCode Release
        run: bash .github/scripts/sync-gitcode-release.sh
