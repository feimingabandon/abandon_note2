<!doctype html>
<!--
  ============================================================
  主窗口的设置窗口 HTML 入口（窗口 2 / 4）
  ============================================================
  由 main/index.js 中的 createMainSettingsWindow() 加载。
  共用同一个 preload 脚本（window.electron / window.api 均可用）。
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>设置</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>
  <body>
    <!-- Vue 应用挂载点 → settings-main.js 会将 SettingsApp.vue 渲染到此 -->
    <div id="app"></div>
    <!-- 独立的 Vue 入口脚本 -->
    <script type="module" src="/src/settings-main.js"></script>
  </body>
</html>
