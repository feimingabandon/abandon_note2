name: Sync to Gitee

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已公开的 GitHub Release 标签；留空时仅验证 Gitee API 访问'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITEE_API_BASE: https://gitee.com/api/v5
  GITEE_OWNER: zou-feiming
  GITEE_REPO: abandon_note2

jobs:
  verify-access:
    name: Verify Gitee access
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify repository API access
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash .github/scripts/verify-gitee-access.sh

  mirror-main:
    name: Mirror main branch to Gitee
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository API access
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash .github/scripts/verify-gitee-access.sh

      - name: Push main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          basic_auth="$(printf '%s:%s' "$GITEE_OWNER" "$GITEE_TOKEN" | base64 --wrap=0)"
          git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git -c "http.extraHeader=Authorization: Basic ${basic_auth}" \
            push gitee HEAD:refs/heads/main

  sync-release:
    name: Sync published Release to Gitee
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      TARGET_COMMITISH: main
      RELEASE_ASSET_DIR: release-assets
      RELEASE_BODY_FILE: release-body.md
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository API access
        run: bash .github/scripts/verify-gitee-access.sh

      - name: Mirror release tag to Gitee
        run: |
          basic_auth="$(printf '%s:%s' "$GITEE_OWNER" "$GITEE_TOKEN" | base64 --wrap=0)"
          git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git -c "http.extraHeader=Authorization: Basic ${basic_auth}" \
            push gitee "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Download GitHub Release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_ASSET_DIR"

      - name: Prepare release metadata
        env:
          MANUAL_RELEASE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$MANUAL_RELEASE_SYNC" == "true" ]]; then
            release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,name,body,tagName)"
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "false" ]]; then
              echo "Manual Gitee synchronization requires a published GitHub Release: ${RELEASE_TAG}." >&2
              exit 1
            fi
            jq -r '.body // ""' <<< "$release_json" > "$RELEASE_BODY_FILE"
            release_name="$(jq -r '.name // .tagName' <<< "$release_json")"
            prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
          else
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > "$RELEASE_BODY_FILE"
            release_name="$(jq -r '.release.name // .release.tag_name' "$GITHUB_EVENT_PATH")"
            prerelease="$(jq -r '.release.prerelease // false' "$GITHUB_EVENT_PATH")"
          fi
          {
            echo "RELEASE_NAME<<__RELEASE_NAME__"
            echo "$release_name"
            echo "__RELEASE_NAME__"
            echo "PRERELEASE=${prerelease}"
          } >> "$GITHUB_ENV"

      - name: Synchronize Gitee Release
        run: bash .github/scripts/sync-gitee-release.sh
