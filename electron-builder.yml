appId: io.gitee.zoufeiming.abandonnote
productName: Abandon便签
copyright: Copyright © 2026 feimingzou
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/koffi/**
win:
  executableName: AbandonNote
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: native_blur/build/bin/
      to: native_blur/
      filter:
        - '*.dll'
protocols:
  - name: Abandon便签通知操作
    schemes:
      - abandon-note
nsis:
  artifactName: Abandon-Note-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  installerLanguages:
    - zh_CN
    - en_US
mac:
  icon: build/icon.icns
  identity: null
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Abandon-Note-${version}-macos-${arch}.${ext}
